[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sidduet"
version = "0.4.2"
description = "Cross-task diagnostic toolkit and benchmark workflows for Semantic IDs across search and recommendation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Jiandong Ding", email = "dingjiandong2@huawei.com" },
]
keywords = [
  "semantic-ids",
  "search-and-recommendation",
  "cross-task-evaluation",
  "generative-retrieval",
  "exposure-allocation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
calibration = ["numpy>=1.26"]
provider = ["numpy>=1.26", "pyarrow>=16.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/jdding/SIDDuet"
Documentation = "https://github.com/jdding/SIDDuet/blob/v0.4.2/ARTIFACT_QUICKSTART.md"
Repository = "https://github.com/jdding/SIDDuet"
Issues = "https://github.com/jdding/SIDDuet/issues"
Demo = "https://jdding.github.io/SIDDuet/"

[project.scripts]
sidduet = "sidduet.cli:main"

[tool.setuptools.packages.find]
include = ["sidduet*"]
